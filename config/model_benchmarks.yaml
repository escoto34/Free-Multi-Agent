# ---------------------------------------------------------------------------
# Selection policy (systems.md §4.3) — editable, not hardcoded in Python
# ---------------------------------------------------------------------------
# WAVE-21: selection is score-driven (core/model_scoring.py fitness ranking).
#   (1) primary degraded/unavailable (quota_exhausted | rate_limited_429 |
#       empty_completion | unavailable) → best-ranked non-primary candidate;
#   (2) hard task (relevant_max ≥ hard_threshold) → picked model's role
#       quality must also clear hard_threshold (escalate if not);
#   (3) pinned roles (pin: true, e.g. deep_research.web_search) never swap;
#   (4) healthy primary keeps its seat unless the best candidate wins by
#       score_advantage_threshold (anti-churn hysteresis).
selection_defaults:
  score_advantage_threshold: 8   # systems.md: switch only when Δfitness ≥ 8
  hard_threshold: 70             # difficulty on a relevant area for quality gate
  capacity_margin: 5             # kept for diagnostics / future planners
  warn_hy3_days: 3               # CLI warning window (days before free_until)
  expired_score_cap: 49          # cap model area scores after free_until (auto-scorer)
  # WAVE-20 scoring v2 — quality/efficiency fusion (core/model_scoring.py)
  quality_weight: 0.75
  efficiency_weight: 0.25
  # Difficulty aggregate (core/difficulty_scorer.py): the 6 coefficients were
  # hardcoded (0.30*code + 0.25*reason + 0.15*ground + 0.15*synth + 0.05*safety
  # + 0.10*max(logic, errors)); defaults below preserve byte-identical output.
  # Editing these values changes aggregate difficulty behavior.
  quality_aggregate:
    code_weight: 0.30
    reason_weight: 0.25
    ground_weight: 0.15
    synth_weight: 0.15
    safety_weight: 0.05
    logic_error_weight: 0.10

# Per-role: which systems.md areas matter + threshold overrides (§4.3 role table)
roles:
  # WAVE-18: architect merged into coder (planning rules part of coder prompt).
  vibe_coding.coder:
    relevant_areas: [code, reason]
    hard_threshold: 70
    # Prefer fallback: Mistral Experiment 429 / empty artifact
    # Prefer keep: clean TechnicalSpec → Codestral specialization
  vibe_coding.debugger:
    relevant_areas: [code, reason]
    hard_threshold: 68
    # Prefer fallback: Groq 120b RPD exhausted / 429 / empty
    # Prefer keep: hard traceback multi-hop fix
  deep_research.context_compressor:
    # WAVE-18: safety gate folded into compressor (replaces safety_filter role).
    relevant_areas: [reason, synth, safety]
    hard_threshold: 70
  deep_research.web_search:
    # No role fallback in model_router.yaml — selector never invents one
    relevant_areas: [ground]
    hard_threshold: 90
    # WAVE-21: structural pin — ranking must never propose a swap; no live
    # search → abort (graph), not model swap. Formerly an accident of missing
    # config, now enforced by select_for_role.
    pin: true
  deep_research.grounding:
    relevant_areas: [ground, synth, reason]
    hard_threshold: 65
    # Prefer fallback: Cohere trial empty / 429 / ToS; keep Command A+ as default RAG
  deep_research.synthesizer:
    relevant_areas: [synth, reason]
    hard_threshold: 70
  cli.chat:
    relevant_areas: [reason, synth, code]
    hard_threshold: 72
  cli.planner:
    relevant_areas: [reason, synth]
    hard_threshold: 70

# ---------------------------------------------------------------------------
# Reasoning / thinking effort (systems.md §4.5)
# Free-tier quotas are per CALL, not per token — raising effort does NOT cost
# extra RPD. Prefer higher effort on hard tasks when the model supports it.
# ---------------------------------------------------------------------------
reasoning:
  enabled: true
  # Map DifficultyAssessment relevant_max / overall → abstract effort band
  difficulty_bands:
    - max_exclusive: 50
      effort: low
    - max_exclusive: 75
      effort: medium
    - max_exclusive: 101
      effort: high
  effort_rank: [low, medium, high]
  # Default API presentation: hide CoT from message.content (JSON agents)
  default_include_reasoning: false
  # Per-role floors/ceilings on abstract effort (applied after difficulty band)
  role_effort:
    vibe_coding.coder:
      min_effort: low
    vibe_coding.debugger:
      min_effort: medium   # fix loops benefit from deeper reasoning
    deep_research.context_compressor:
      min_effort: low
    deep_research.web_search:
      max_effort: low      # compound-mini: search tools, not long CoT
    deep_research.grounding:
      min_effort: low      # RAG quality ≠ GPT-OSS effort API
    deep_research.synthesizer:
      min_effort: medium
    cli.chat:
      min_effort: low
    cli.planner:
      min_effort: medium
  # Models that accept Groq/OpenAI-compatible reasoning kwargs.
  # style:
  #   groq_gpt_oss  → reasoning_effort=low|medium|high + include_reasoning
  #   groq_qwen     → reasoning_effort=none|default + reasoning_format
  # Unknown models → no extra kwargs (safe for cascade to Agnes/Codestral/etc.)
  model_capabilities:
    groq/openai/gpt-oss-120b:
      style: groq_gpt_oss
    groq/openai/gpt-oss-20b:
      style: groq_gpt_oss
    groq/openai/gpt-oss-safeguard-20b:
      style: groq_gpt_oss
    groq/qwen/qwen3.6-27b:
      style: groq_qwen
    # Catalog leaf if cascade lands here with same OpenAI-compat surface
    cerebras/gpt-oss-120b:
      style: groq_gpt_oss

