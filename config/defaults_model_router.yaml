# Factory defaults — free-durable orchestration (mid-2026).
# Live overrides: config/model_router.yaml (same shape). Reset: multiagent config reset
#
# Design goals:
#   - Spread scarce free buckets (Cohere ~28/day, OpenRouter :free ~50 RPD shared)
#   - Use Agnes free text (agnes-2.0-flash, ~20 RPM fair-use) for high-volume roles
#   - Groq per-model ~1k RPD; compound-mini ~250 RPD for web_search only
#   - Codestral for coding; Cohere only for grounding; no hy3/openrouter on hot path
providers:
  groq:
    base_url: https://api.groq.com/openai/v1
    env_key: GROQ_API_KEY
    signup: https://console.groq.com/keys
    notes: >-
      Free ~1000 RPD/model (gpt-oss family). compound-mini ~250 RPD + Tavily web search
      — reserve for deep_research.web_search only.
    daily_limit_per_model: 800
    models:
    - openai/gpt-oss-120b
    - openai/gpt-oss-20b
    - openai/gpt-oss-safeguard-20b
    - qwen/qwen3.6-27b
    - groq/compound-mini
    - groq/compound
    - llama-3.3-70b-versatile
  openrouter:
    base_url: https://openrouter.ai/api/v1
    env_key: OPENROUTER_API_KEY
    signup: https://openrouter.ai/keys
    notes: >-
      ~50 RPD free models shared (20 RPM); ~1000 RPD after $10 lifetime credits.
      Prefer :free model ids. Not on free-durable hot path — catalog for optional use.
    daily_limit_shared: 45
    models:
    - cohere/north-mini-code:free
    - google/gemma-4-26b-a4b-it:free
    - google/gemma-4-31b-it:free
    - inclusionai/ling-3.0-flash:free
    - nvidia/nemotron-3-nano-30b-a3b:free
    - nvidia/nemotron-3-super-120b-a12b:free
    - nvidia/nemotron-3-ultra-550b-a55b:free
    - nvidia/nemotron-3.5-content-safety:free
    - openai/gpt-oss-20b:free
    - poolside/laguna-s-2.1:free
    - poolside/laguna-xs-2.1:free
  cohere:
    env_key: COHERE_API_KEY
    signup: https://dashboard.cohere.com/api-keys
    notes: >-
      Trial ~1000 calls/month (~25-30/day). Non-commercial on trial — check ToS.
      Free-durable: only deep_research.grounding uses Cohere as primary.
    daily_limit: 28
    models:
    - command-a-plus-05-2026
    - command-r-plus-08-2024
    - command-r7b-12-2024
  mistral:
    base_url: https://api.mistral.ai/v1
    env_key: MISTRAL_API_KEY
    signup: https://console.mistral.ai
    notes: 'Studio Free / Experiment: no card, rate-limited. codestral + small/medium/devstral.'
    daily_limit: 200
    models:
    - mistral-small-latest
    - mistral-medium-latest
    - codestral-latest
    - devstral-latest
    - devstral-medium-latest
    - ministral-8b-latest
    - ministral-14b-latest
    - magistral-small-latest
    - mistral-medium-3-5
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    env_key: GEMINI_API_KEY
    signup: https://aistudio.google.com/apikey
    notes: Google AI Studio free. Flash models have higher free RPM; Pro is tighter.
    daily_limit: 400
    models:
    - gemini-2.5-flash
    - gemini-2.0-flash
    - gemini-2.5-flash-lite
    - gemini-3.1-flash-lite
    - gemini-3-flash-preview
    - gemini-3.5-flash
    - gemini-3.5-flash-lite
    - gemini-3.6-flash
    - gemma-4-26b-a4b-it
    - gemma-4-31b-it
  cerebras:
    base_url: https://api.cerebras.ai/v1
    env_key: CEREBRAS_API_KEY
    signup: https://cloud.cerebras.ai
    notes: >-
      Catalog changes often. Free/dev ~5 RPM, ~1M TPD. Common IDs: gemma-4-31b,
      gpt-oss-120b, zai-glm-4.7 (Llama IDs may 404). Quality burst fallback, not hot path.
    daily_limit: 150
    models:
    - gemma-4-31b
    - gpt-oss-120b
    - zai-glm-4.7
  ollama:
    base_url: http://localhost:11434/v1
    env_key: OLLAMA_API_KEY
    signup: https://ollama.com/download
    notes: >-
      Local OpenAI-compatible server. No API key required.
      Model list is ONLY what `ollama list` reports (daemon /api/tags) — not a static catalog.
      Override host: OLLAMA_BASE_URL or OLLAMA_HOST. Pull: ollama pull <name>.
    daily_limit: 100000
    models: []   # populated at runtime from `ollama list` only
  agnes:
    base_url: https://apihub.agnes-ai.com/v1
    env_key: AGNES_API_KEY
    signup: https://platform.agnes-ai.com
    notes: >-
      Agnes AI free multimodal OpenAI-compatible gateway (no card).
      Chat/pipelines text model: agnes-2.0-flash (~20 RPM free fair-use, $0/M tokens,
      large context, tool-calling, coding, agents — Claw-Eval strong).
      Also free (other endpoints, not chat roles): agnes-image-2.0-flash,
      agnes-image-2.1-flash (/v1/images/generations), agnes-video-v2.0 (/v1/videos).
      Key: platform.agnes-ai.com
    daily_limit: 2000
    models:
    - agnes-2.0-flash
    - agnes-2.5-flash
    - agnes-2.5-pro
  opencode_zen:
    base_url: https://opencode.ai/zen/v1
    env_key: OPENCODE_ZEN_API_KEY
    signup: https://opencode.ai/auth
    notes: >-
      Free tier, no card required. Per-model rate limits not publicly documented
      as of mid-2026 — daily_limit_shared below is a conservative estimate, not a
      confirmed ceiling (WAVE-08). Catalog / fallback tier only — not assigned
      as any primary role. Verified live via /models probe on 2026-08-04
      (WAVE-19); hy3-free is gone from the live catalog and was removed.
    daily_limit_shared: 100
    models:
    - big-pickle
    - deepseek-v4-flash-free
    - nemotron-3-ultra-free
    - mimo-v2.5-free
    - north-mini-code-free
    - laguna-s-2.1-free
    - ling-3.0-flash-free
deprecated:
- llama-3.1-8b-instant
- qwen/qwen3-32b
- llama-4-scout-17b-16e-instruct
vibe_coding:
  # Coder (WAVE-18: the former architect planning role is folded into this
  # agent — planning rules are part of the coder's system prompt).
  coder:
    # WAVE-21: score-driven re-tune — cerebras/gpt-oss-120b is the fitness top
    # for [code, reason]; the displaced former primary stays as the role
    # fallback and the provider DAG continues from there.
    provider: cerebras
    model: gpt-oss-120b
    fallback:
      provider: mistral
      model: codestral-latest
  # Debugger: Groq gpt-oss reasoning; Agnes if Groq exhausted
  debugger:
    provider: groq
    model: openai/gpt-oss-120b
    fallback:
      provider: agnes
      model: agnes-2.0-flash
  max_fix_cycles: 3
deep_research:
  # Compressor (WAVE-18: safety gate + planning folded in from the removed
  # safety_filter role). Free Agnes volume (replaces OpenRouter hy3).
  context_compressor:
    # WAVE-21: score-driven re-tune — cerebras/gpt-oss-120b tops [reason,
    # synth, safety]; former primary agnes stays as fallback. The old gemini
    # fallback is gone: gemini-2.0-flash is marked available: false (quota 0 /
    # 404 for this key, WAVE-20 follow-up).
    provider: cerebras
    model: gpt-oss-120b
    fallback:
      provider: agnes
      model: agnes-2.0-flash
  # Live web search — only free path with Tavily; ~250 RPD
  web_search:
    provider: groq
    model: groq/compound-mini
  # Sole Cohere primary (anti-hallucination / documents=)
  grounding:
    provider: cohere
    model: command-a-plus-05-2026
    fallback:
      provider: mistral
      model: mistral-small-latest
  # Long synthesis: Groq 120b; Agnes 512k-class context as fallback
  synthesizer:
    provider: groq
    model: openai/gpt-oss-120b
    fallback:
      provider: agnes
      model: agnes-2.0-flash
# Fallback DAG: avoid OpenRouter :free sink; Agnes is a durable free hop.
# Acyclic leaf via cerebras → groq (skip-visited breaks rings).
fallback_cascade:
  cohere_fallback:
    provider: mistral
    model: mistral-small-latest
  openrouter_fallback:
    provider: agnes
    model: agnes-2.0-flash
  groq_fallback:
    provider: gemini
    model: gemini-2.0-flash
  mistral_fallback:
    provider: agnes
    model: agnes-2.0-flash
  gemini_fallback:
    provider: cerebras
    model: gemma-4-31b
  cerebras_fallback:
    provider: groq
    model: openai/gpt-oss-120b
  agnes_fallback:
    provider: groq
    model: openai/gpt-oss-120b
  ollama_fallback:
    provider: mistral
    model: mistral-small-latest
  opencode_zen_fallback:
    provider: agnes
    model: agnes-2.0-flash
cli:
  chat:
    # WAVE-21: score-driven re-tune — cli.chat now goes through role selection
    # (was a raw invoke_router bypass); primary cerebras/gpt-oss-120b with the
    # former primary agnes as fallback (cascade continues via agnes_fallback).
    provider: cerebras
    model: gpt-oss-120b
    fallback:
      provider: agnes
      model: agnes-2.0-flash
  planner:
    # Keep free-durable; do not use OpenRouter hy3 on hot path (50 RPD / expiry)
    # WAVE-21: score-driven re-tune — cerebras/gpt-oss-120b tops [reason, synth].
    provider: cerebras
    model: gpt-oss-120b
    fallback:
      provider: agnes
      model: agnes-2.0-flash

  context_limit_tokens: 16000
  compact_keep_recent_messages: 4
  compact_target_ratio: 0.45
  use_graphify: true
  graphify_budget: 1200
  chat_recent_messages: 4
  store_reply_max_chars: 1200
